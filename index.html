<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Newphorus — a modern Scratch 1, 2, and 3 project player.">
  <title>Newphorus</title>
  <link rel="stylesheet" href="index.css?v=20260828-4">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Newphorus</a>
    <a class="header-link" href="https://github.com/itswiktoragain/newphorus" target="_blank" rel="noreferrer">GitHub</a>
  </header>

  <main>
    <section class="hero">
      <h1>Run Scratch projects.</h1>
      <p class="hero-text">Paste a Scratch project URL or ID, or open a local .sb, .sb2, or .sb3 file.</p>
      <form id="project-form" class="load-panel">
        <div class="input-row">
          <input id="project-input" type="text" inputmode="numeric" autocomplete="off" aria-label="Scratch project URL or ID" placeholder="https://scratch.mit.edu/projects/123456789/">
          <button class="primary-button" type="submit">Load</button>
        </div>
        <div class="file-row">
          <label class="secondary-button" for="project-file">Open file</label>
          <input id="project-file" class="visually-hidden" type="file" accept=".sb,.sb2,.sb3,application/zip">
          <span>or drop a project file anywhere on this page</span>
        </div>
      </form>
    </section>

    <section id="player-section" class="player-section" hidden>
      <div class="player-card">
        <div class="player-toolbar">
          <div class="project-meta">
            <span id="project-title" class="project-title">Project</span>
            <a id="scratch-link" class="project-link" target="_blank" rel="noreferrer" hidden>Scratch ↗</a>
          </div>
          <div class="player-controls" aria-label="Player controls">
            <button id="flag-button" class="control-button flag-button" type="button" title="Green flag">▶</button>
            <button id="stop-button" class="control-button stop-button" type="button" title="Stop">■</button>
            <button id="turbo-button" class="control-button" type="button" aria-pressed="false" title="Turbo mode">Turbo</button>
            <button id="fullscreen-button" class="control-button" type="button" title="Fullscreen">⛶</button>
          </div>
        </div>
        <div id="stage-shell" class="stage-shell">
          <div id="stage" class="stage" aria-label="Scratch project stage"></div>
          <div id="loading-overlay" class="loading-overlay" aria-live="polite">
            <div class="loading-card">
              <div class="spinner" aria-hidden="true"></div><strong id="status-text">Loading…</strong>
              <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
            </div>
          </div>
          <div id="error-overlay" class="error-overlay" hidden>
            <div class="error-card">
              <strong>Couldn’t load this project.</strong>
              <p id="error-text"></p>
              <a href="https://github.com/itswiktoragain/newphorus/issues/new" target="_blank" rel="noreferrer">Report issue ↗</a>
            </div>
          </div>
        </div>
      </div>

      <div class="project-tools">
        <div class="embed-tool">
          <span class="tool-label">Embed</span>
          <input id="embed-code" class="code-field" readonly aria-label="Embed code">
        </div>
        <a id="standalone-link" class="secondary-button inline-button" target="_blank">Standalone ↗</a>
      </div>
    </section>
  </main>

  <footer>
    <span>Newphorus</span>
    <span>·</span>
    <a href="https://github.com/itswiktoragain/newphorus/issues" target="_blank" rel="noreferrer">Issues</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.4.0/dist/scaffolding-with-music.js"></script>
  <script src="newphorus.js?v=20260828-4"></script>
  <script>Newphorus.bootstrapHome();</script>
</body>
</html>
